<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
    <defs>
      <radialGradient id="bg" cx="50%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#0B402B"/>
        <stop offset="50%" stop-color="#051E14"/>
        <stop offset="100%" stop-color="#020805"/>
      </radialGradient>
      <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00F59B" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
      </linearGradient>
      <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="35" />
      </filter>
    </defs>
    <rect width="600" height="450" fill="url(#bg)"/>
    <circle cx="300" cy="180" r="140" fill="#00F59B" opacity="0.16" filter="url(#blurFilter)"/>
    <rect x="20" y="20" width="560" height="410" rx="20" fill="none" stroke="url(#glow)" stroke-width="1.5"/>
    
    <!-- Central Icon / Illustration -->
    <g transform="translate(300, 180)">
      <g transform="translate(-35, -45)"><rect x="15" y="10" width="42" height="60" rx="6" fill="#0A3E28" stroke="#00F59B" stroke-width="2.5"/><line x1="24" y1="24" x2="48" y2="24" stroke="#00F59B" stroke-width="3" stroke-linecap="round"/><line x1="24" y1="36" x2="42" y2="36" stroke="#00F59B" stroke-width="2" stroke-linecap="round"/><circle cx="36" cy="52" r="8" fill="#00F59B" opacity="0.5"/></g>
    </g>
    
    
      <rect x="50" y="50" width="130" height="28" rx="14" fill="#00F59B" fill-opacity="0.15" stroke="#00F59B" stroke-width="1"/>
      <text x="115" y="68" fill="#00F59B" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.1em">CAMPAIGN ART</text>
    

    <text x="300" y="375" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="-0.02em">Poster & Social Media Design</text>
    <text x="300" y="405" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="middle">Creative posters for ads, campaigns and social branding</text>
